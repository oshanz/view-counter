services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: viewcounter
      POSTGRES_PASSWORD: viewcounter
      POSTGRES_DB: viewcounter
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewcounter"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Exposes NATS and JetStream monitoring data as Prometheus metrics on :7777
  # for the collector below.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    command: ["-jsz=all", "-varz", "-connz", "http://nats:8222"]
    depends_on:
      nats:
        condition: service_healthy

  # Scrapes host, Postgres and container metrics and ships them to the local
  # SigNoz ingester on the host (port 4317). Needs SigNoz running; otherwise it
  # just retries.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0"
    hostname: view-counter-host
    environment:
      SIGNOZ_OTLP_ENDPOINT: host.docker.internal:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats-exporter:
        condition: service_started

volumes:
  pgdata:
  natsdata:
