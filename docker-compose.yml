services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: viewcounter
      POSTGRES_PASSWORD: viewcounter
      POSTGRES_DB: viewcounter
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewcounter"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
