services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: viewcounter
      POSTGRES_PASSWORD: viewcounter
      POSTGRES_DB: viewcounter
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewcounter"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
  natsdata:
